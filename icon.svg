<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f3f4f6"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>

  <!-- Subtle ground hill -->
  <path d="M 0 420 Q 256 360 512 420 L 512 512 L 0 512 Z" fill="#22c55e" opacity="0.95"/>
  <path d="M 0 460 Q 256 420 512 460 L 512 512 L 0 512 Z" fill="#16a34a"/>

  <!-- Sun -->
  <circle cx="90" cy="110" r="45" fill="#fef08a"/>
  <circle cx="90" cy="110" r="35" fill="#facc15"/>

  <!-- Cloud -->
  <path d="M 370 120 a 25 25 0 0 1 40 -5 a 20 20 0 0 1 35 15 a 15 15 0 0 1 5 15 l -80 0 a 15 15 0 0 1 0 -25 z" fill="#ffffff" opacity="0.9"/>

  <!-- 3D Style House in center -->
  <g filter="url(#dropShadow)">
    <!-- Chimney -->
    <rect x="320" y="170" width="38" height="60" rx="4" fill="#b91c1c"/>
    <rect x="314" y="162" width="50" height="12" rx="4" fill="#991b1b"/>
    <!-- Smoke puffs -->
    <circle cx="340" cy="140" r="10" fill="#ffffff" opacity="0.7"/>
    <circle cx="355" cy="115" r="14" fill="#ffffff" opacity="0.5"/>

    <!-- House Body -->
    <rect x="156" y="240" width="200" height="160" rx="16" fill="url(#wallGrad)"/>

    <!-- House Roof -->
    <polygon points="130,250 256,130 382,250" fill="url(#roofGrad)"/>
    <polygon points="145,246 256,140 367,246" fill="#ef4444" opacity="0.6"/>

    <!-- Window -->
    <rect x="180" y="270" width="55" height="55" rx="10" fill="#bae6fd" stroke="#0284c7" stroke-width="6"/>
    <line x1="207" y1="270" x2="207" y2="325" stroke="#0284c7" stroke-width="4"/>
    <line x1="180" y1="297" x2="235" y2="297" stroke="#0284c7" stroke-width="4"/>

    <!-- Door -->
    <rect x="270" y="295" width="60" height="105" rx="8" fill="#d97706" stroke="#b45309" stroke-width="4"/>
    <circle cx="320" cy="350" r="6" fill="#fde68a"/>
  </g>

  <!-- Letter Cards in foreground: 'C', 'A', 'S', 'A' -->
  <g filter="url(#dropShadow)" transform="translate(0, 20)">
    <!-- Card C -->
    <g transform="translate(85, 360) rotate(-8)">
      <rect width="70" height="85" rx="14" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="5"/>
      <text x="35" y="60" font-family="'Comic Sans MS', 'Arial Rounded MT Bold', sans-serif" font-weight="900" font-size="52" fill="#d97706" text-anchor="middle">C</text>
    </g>

    <!-- Card A -->
    <g transform="translate(165, 350) rotate(-2)">
      <rect width="70" height="85" rx="14" fill="url(#cardGrad)" stroke="#10b981" stroke-width="5"/>
      <text x="35" y="60" font-family="'Comic Sans MS', 'Arial Rounded MT Bold', sans-serif" font-weight="900" font-size="52" fill="#059669" text-anchor="middle">A</text>
    </g>

    <!-- Card S -->
    <g transform="translate(245, 350) rotate(3)">
      <rect width="70" height="85" rx="14" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="5"/>
      <text x="35" y="60" font-family="'Comic Sans MS', 'Arial Rounded MT Bold', sans-serif" font-weight="900" font-size="52" fill="#2563eb" text-anchor="middle">S</text>
    </g>

    <!-- Card A -->
    <g transform="translate(325, 360) rotate(8)">
      <rect width="70" height="85" rx="14" fill="url(#cardGrad)" stroke="#ec4899" stroke-width="5"/>
      <text x="35" y="60" font-family="'Comic Sans MS', 'Arial Rounded MT Bold', sans-serif" font-weight="900" font-size="52" fill="#db2777" text-anchor="middle">A</text>
    </g>
  </g>

  <!-- Golden Coin badge -->
  <g transform="translate(380, 220)" filter="url(#dropShadow)">
    <circle cx="35" cy="35" r="32" fill="#eab308" stroke="#ca8a04" stroke-width="4"/>
    <circle cx="35" cy="35" r="26" fill="#facc15"/>
    <text x="35" y="47" font-family="'Arial Rounded MT Bold', sans-serif" font-weight="bold" font-size="34" fill="#a16207" text-anchor="middle">★</text>
  </g>
</svg>
